title: 'Renumber'
tooltip: >
  Renumber a chosen field (Rebar Number, Schedule Mark, Mark, Comments, or
  Partition) of selected rebar in reading order (top row first, left to
  right within each row), based on the project's default XY directions.
  Built for Revit 2026, where Rebar Number is written directly, the same
  way as Mark/Comments. Two modes: group identical bars under one number,
  or give every bar its own number. Select rebar in the model first, then
  run this tool.
author: 'NBT / pyNBT'
