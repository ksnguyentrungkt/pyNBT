title: Align Tag
tooltip: >
  Rotate a Floor / Beam / Column / Wall tag to run parallel to a
  reference line YOU define. Pick a tag, then click 2 points anywhere
  in the view (snaps work like any Revit pick, host model or linked
  file) - the tag rotates immediately to match that line's direction
  and the tool finishes right away. Run it again to align another tag.
author: Nguyen Bao Trung (pyNBT)
